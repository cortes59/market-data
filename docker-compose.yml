services:
  postgres:
    image: postgres:16-alpine
    container_name: market-data-postgres
    environment:
      POSTGRES_USER: market_user
      POSTGRES_PASSWORD: market_pass
      POSTGRES_DB: market_data
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U market_user -d market_data"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - market-data-network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: market-data-backend
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://market_user:market_pass@postgres:5432/market_data
      BACKEND_PORT: 3000
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - market-data-network
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: market-data-frontend
    ports:
      - "5173:80"
    environment:
      VITE_API_URL: http://localhost:3000
    depends_on:
      - backend
    networks:
      - market-data-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  market-data-network:
    driver: bridge
